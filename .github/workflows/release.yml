# 推送 v* 标签时自动：构建镜像 → 推送 GHCR → 创建 GitHub Release。
# NAS 端即可免构建直接 docker pull ghcr.io/shihao618/xiaoai_lit:latest
name: Release & Publish Image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=sha
            type=raw,value=latest

      # 仅构建 linux/amd64：飞牛 OS 目前以 x86_64 机型为主；
      # ddddocr/onnxruntime 的 ARM wheel 可用性未逐一验证，不冒险产出 arm64 镜像。
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## Docker 镜像

            ```bash
            docker pull ghcr.io/shihao618/xiaoai_lit:${{ github.ref_name }}
            docker pull ghcr.io/shihao618/xiaoai_lit:latest
            ```

            飞牛 OS（fnOS）免构建部署：使用仓库中的 `docker-compose.fnos-image.yml`。

            > 若首次拉取提示无权限：GitHub → 个人/仓库 → Packages → 本镜像包 →
            > Package settings → Change visibility → Public；
            > 或 NAS 上 `docker login ghcr.io`（用户名 GitHub 账号，密码用 PAT）。
