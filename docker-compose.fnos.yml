# 洛阳理工学院课表提醒服务 —— 飞牛 OS（fnOS）本地目录持久化 + 本地构建
#
# 使用（fnOS 应用中心 → Docker → Compose → 新建项目）：
#   1) 项目目录选本仓库目录（含 Dockerfile/lit/main.py/wsgi.py）
#   2) 先创建本地持久化目录（属主为 NAS 用户）：
#        mkdir -p data cache
#   3) Compose 文件选 docker-compose.fnos.yml，构建并启动
#
# 数据持久化（本编排的核心区别）：
#   左侧是 NAS 上的真实目录（默认 ./data、./cache，相对项目目录），
#   可在 .env 用 DATA_PATH / CACHE_PATH 覆盖为绝对路径（如 /vol1/1000/docker/lit/data）。
#   容器以 PUID:PGID（默认 1000:1000，即 fnOS 默认用户）运行，保证能写入这些目录。
#   注意：目录必须提前创建；若由 Docker 自动创建会归 root 所有，容器将无法写入。
#
# 播报走云端 MIoT，无需固定局域网 IP；10379 仅 Web 管理页使用（WEB_PORT 可改）。

services:
  lit-course-reminder:
    build:
      context: .
      dockerfile: Dockerfile
    image: lit-course-reminder:latest
    container_name: lit-course-reminder
    restart: unless-stopped
    init: true
    security_opt:
      - "no-new-privileges:true"
    stop_grace_period: 35s
    # 以 NAS 用户身份运行（fnOS 默认 UID/GID 1000），保证本地持久化目录可写且文件属主正确
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      - "${WEB_PORT:-10379}:10379"
    environment:
      # ---- 教务系统 ----
      - JWXT_BASE_URL=${JWXT_BASE_URL:-https://lljw.lit.edu.cn}
      - JWXT_ACCOUNT=${JWXT_ACCOUNT:-}
      - JWXT_PASSWORD=${JWXT_PASSWORD:-}
      # ---- 业务参数 ----
      - REMIND_BEFORE_MINUTES=${REMIND_BEFORE_MINUTES:-30}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      # 可选：Cookie 检查间隔（秒，默认 1800 = 30 分钟）
      # - COOKIE_REFRESH_INTERVAL=1800
      # ---- 持久化路径（容器内路径，勿改；宿主路径见下方 volumes） ----
      - CACHE_DIR=/app/cache
      - DATA_DIR=/app/data
      # onnxruntime 等第三方库需要可写 HOME，避免只读告警
      - HOME=/tmp
    volumes:
      # 本地持久化目录：默认在项目目录下，可用 .env 的 DATA_PATH / CACHE_PATH 覆盖
      - ${DATA_PATH:-./data}:/app/data
      - ${CACHE_PATH:-./cache}:/app/cache
    healthcheck:
      test:
        - CMD
        - python
        - "-c"
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:10379/api/status', timeout=3).status == 200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
